[project]
name = "analysis-wrapper"
version = "0.3.0"
description = "Project Analysis tool-execution wrapper (stdlib core; pydriller only in the git_history lane)"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["analysis_wrapper*"]

[project.scripts]
project-analysis-wrapper = "analysis_wrapper.cli:main"

[project.optional-dependencies]
history = ["pydriller==2.10"]
sql = ["sqlglot==30.12.0"]
report = ["markdown-it-py==3.0.0"]
dev = ["pytest", "jsonschema"]

[tool.setuptools.package-data]
analysis_wrapper = [
    "report_html/static/*.css",
    "report_html/static/*.js",
    "report_html/vendor/*.js",
    "report_html/vendor/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
